<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Registration System</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Welcome, <span id="userName"></span></h1>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </header>

        <div class="profile-section">
            <h2>Profile Information</h2>
            <div class="profile-info">
                <div class="info-row">
                    <span class="label">Name:</span>
                    <span id="profileName" class="value"></span>
                </div>
                <div class="info-row">
                    <span class="label">Email:</span>
                    <span id="profileEmail" class="value"></span>
                </div>
                <div class="info-row">
                    <span class="label">Username:</span>
                    <span id="profileUsername" class="value"></span>
                </div>
                <div class="info-row">
                    <span class="label">Mobile:</span>
                    <span id="profileMobile" class="value"></span>
                </div>
                <div class="info-row">
                    <span class="label">Age:</span>
                    <span id="profileAge" class="value"></span>
                </div>
                <div class="info-row">
                    <span class="label">Gender:</span>
                    <span id="profileGender" class="value"></span>
                </div>
                <div class="info-row">
                    <span class="label">Member Since:</span>
                    <span id="profileCreatedAt" class="value"></span>
                </div>
            </div>
            <button id="editProfileBtn" class="btn-edit">Edit Profile</button>
        </div>

        <div class="sessions-section">
            <h2>Active Sessions</h2>
            <div id="sessionsList"></div>
        </div>

        <!-- Edit Profile Modal (hidden by default) -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Edit Profile</h2>
                <form id="editProfileForm">
                    <div class="form-group">
                        <label for="editName">Name</label>
                        <input type="text" id="editName" name="name">
                    </div>
                    <div class="form-group">
                        <label for="editMobile">Mobile</label>
                        <input type="tel" id="editMobile" name="mobile">
                    </div>
                    <div class="form-group">
                        <label for="editAge">Age</label>
                        <input type="number" id="editAge" name="age" min="18" max="120">
                    </div>
                    <div class="form-group">
                        <label for="editGender">Gender</label>
                        <select id="editGender" name="gender">
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-save">Save Changes</button>
                </form>
                <div id="editMessage" class="message"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
