<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Registration System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required maxlength="100">
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="mobile">Mobile Number *</label>
                <input type="tel" id="mobile" name="mobile" required pattern="\+?[0-9]{10,15}" placeholder="e.g., +1234567890">
            </div>
            <div class="form-group">
                <label for="age">Age *</label>
                <input type="number" id="age" name="age" required min="18" max="120">
            </div>
            <div class="form-group">
                <label for="gender">Gender *</label>
                <select id="gender" name="gender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                </select>
            </div>
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required minlength="8">
                <small>At least 8 characters</small>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
            <div id="message" class="message"></div>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
        <p><a href="index.html">Back to Home</a></p>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const age = parseInt(document.getElementById('age').value);
            const gender = document.getElementById('gender').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            const messageDiv = document.getElementById('message');

            if (password !== confirm) {
                messageDiv.textContent = 'Passwords do not match';
                messageDiv.className = 'message error';
                return;
            }

            try {
                const response = await registerRequest({ name, email, mobile, age, gender, password });
                if (response.success) {
                    // Store email for OTP verification
                    localStorage.setItem('pendingRegistrationEmail', email);
                    window.location.href = 'verify-otp.html';
                } else {
                    messageDiv.textContent = response.error?.message || 'Registration failed';
                    messageDiv.className = 'message error';
                }
            } catch (error) {
                messageDiv.textContent = error.message || 'An error occurred';
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
