<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AuthFlow Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Triangle Pattern */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(60deg, rgba(99,102,241,0.05) 0px, rgba(99,102,241,0.05) 1px, transparent 1px, transparent 12px);
            pointer-events: none;
        }

        .reset-container {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(135deg, rgba(20, 30, 45, 0.95), rgba(10, 20, 35, 0.98));
            backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(168, 85, 247, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reset-header {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            padding: 48px 32px;
            text-align: center;
        }

        .reset-header h1 {
            color: white;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .reset-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .reset-form {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: white;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.2);
        }

        .btn-reset {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.5);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
        }

        .message.error {
            background: rgba(220, 38, 38, 0.2);
            color: #f87171;
            border-left: 3px solid #ef4444;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border-left: 3px solid #22c55e;
        }

        .back-link {
            text-align: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .back-link a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h1>🔐 Reset Password</h1>
            <p>We'll send a verification code to your email</p>
        </div>
        <div class="reset-form">
            <form id="resetRequestForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="resetEmail" required placeholder="hello@authflow.com">
                </div>
                <button type="submit" class="btn-reset">Send Reset Code →</button>
                <div id="resetRequestMessage" class="message"></div>
            </form>
            <div class="back-link">
                <a href="login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:4000/api/v1';

        document.getElementById('resetRequestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const messageDiv = document.getElementById('resetRequestMessage');

            try {
                const response = await fetch(`${API_BASE}/auth/password-reset/request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error?.message || 'Request failed');
                
                localStorage.setItem('resetEmail', email);
                messageDiv.textContent = '✓ Reset code sent! Redirecting...';
                messageDiv.className = 'message success';
                setTimeout(() => {
                    window.location.href = 'set-new-password.html';
                }, 1500);
            } catch (err) {
                messageDiv.textContent = '❌ ' + err.message;
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
