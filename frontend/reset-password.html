<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Registration System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <p>Enter your email address and we'll send you an OTP to reset your password.</p>
        <form id="resetRequestForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary">Send OTP</button>
            <div id="message" class="message"></div>
        </form>
        <p><a href="login.html">Back to Login</a></p>
        <p><a href="index.html">Back to Home</a></p>
    </div>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('resetRequestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const messageDiv = document.getElementById('message');

            try {
                const response = await requestPasswordReset(email);
                if (response.success) {
                    messageDiv.textContent = response.message;
                    messageDiv.className = 'message success';
                    // Store email to use in OTP verification page
                    localStorage.setItem('resetEmail', email);
                    setTimeout(() => {
                        window.location.href = 'set-new-password.html';
                    }, 2000);
                } else {
                    messageDiv.textContent = response.error?.message || 'Request failed';
                    messageDiv.className = 'message error';
                }
            } catch (error) {
                messageDiv.textContent = error.message || 'An error occurred';
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
