<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Registration System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Verify Email Address</h1>
        <p>We've sent a 6-digit OTP to your email. Please enter it below to complete registration.</p>
        <form id="verifyForm">
            <div class="form-group">
                <label for="otp">OTP Code</label>
                <input type="text" id="otp" name="otp" required maxlength="6" pattern="\d{6}" placeholder="000000">
            </div>
            <button type="submit" class="btn btn-primary">Verify</button>
            <div id="message" class="message"></div>
        </form>
        <p>Didn't receive code? <a href="#" id="resendLink">Resend OTP</a></p>
        <p><a href="register.html">Back to Registration</a></p>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const email = localStorage.getItem('pendingRegistrationEmail');
        if (!email) {
            window.location.href = 'register.html';
        }

        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otpCode = document.getElementById('otp').value.trim();
            const messageDiv = document.getElementById('message');

            try {
                const response = await verifyOtp(email, otpCode);
                if (response.success) {
                    localStorage.removeItem('pendingRegistrationEmail');
                    alert('Account verified successfully! Please login.');
                    window.location.href = 'login.html';
                } else {
                    messageDiv.textContent = response.error?.message || 'Verification failed';
                    messageDiv.className = 'message error';
                }
            } catch (error) {
                messageDiv.textContent = error.message || 'An error occurred';
                messageDiv.className = 'message error';
            }
        });

        document.getElementById('resendLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = 'Resending OTP...';
            messageDiv.className = 'message info';

            // We need to re-send OTP for the same email; this would call the same registration endpoint but with existing pending user.
            // For simplicity, we could call a resend endpoint; but our API doesn't have that. Alternatively, we could re-use the request-otp endpoint.
            // For now, we'll assume the backend supports re-requesting OTP for pending registration.
            try {
                // This requires a pending user in the database; the registration endpoint will detect existing pending user and send new OTP.
                // In a real system, we would have a specific endpoint; but we can simulate by calling the same registration endpoint again.
                // However, our current API would fail because email already exists (but pending). The service should handle that.
                // We'll assume the service handles re-request.
                // For this demo, we'll just alert.
                alert('Resend functionality requires backend support. Please register again if OTP expired.');
                // In production, you'd call: await resendOtp(email);
            } catch (error) {
                messageDiv.textContent = error.message || 'Resend failed';
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
